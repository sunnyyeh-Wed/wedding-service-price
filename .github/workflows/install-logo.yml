name: Install exact logo asset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original logo from Google Drive
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 "https://drive.usercontent.google.com/download?id=1A0kT-wWEdLM4g16xDfmxThUXe0m9G3lT&export=download&confirm=t" -o /tmp/logo-original.png
          file /tmp/logo-original.png | grep -qi "PNG image data"

      - name: Optimize logo and preserve full artwork
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open('/tmp/logo-original.png').convert('RGBA')
          bbox = src.getbbox()
          cropped = src.crop(bbox)
          pad = max(40, int(max(cropped.size) * 0.04))
          canvas = Image.new('RGBA', (cropped.width + pad*2, cropped.height + pad*2), (0,0,0,0))
          canvas.alpha_composite(cropped, (pad,pad))
          max_w = 1400
          if canvas.width > max_w:
              h = round(canvas.height * max_w / canvas.width)
              canvas = canvas.resize((max_w,h), Image.Resampling.LANCZOS)
          canvas.save('assets/logo.png', optimize=True)
          PY

      - name: Point header to local PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace('src="logo-frame.svg"', 'src="assets/logo.png"')
          t = t.replace('.brand img{display:block;height:66px;width:auto}', '.brand img{display:block;height:66px;width:auto;object-fit:contain}')
          p.write_text(t, encoding='utf-8')
          PY

      - name: Commit exact logo asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo.png index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use exact Sunny Yeh logo asset"
          git push
