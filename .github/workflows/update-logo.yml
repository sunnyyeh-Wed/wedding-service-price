name: Update header logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace header brand with logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace('.brand{font-weight:600;letter-spacing:.14em;font-size:15px;text-decoration:none}.brand span{color:var(--gold);font-weight:500}', '.brand{display:flex;align-items:center;text-decoration:none;flex-shrink:0}.brand img{display:block;height:58px;width:auto}')
          t = t.replace('.brand{font-size:13px;letter-spacing:.1em}', '.brand img{height:46px}')
          t = t.replace('<a class="brand" href="#top">SUNNY YEH <span>WEDDING</span></a>', '<a class="brand" href="#top" aria-label="Sunny Yeh Wedding 首頁"><img src="logo.svg" alt="行光合作用 Wedding planner/Emcee"></a>')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use logo in header"
          git push
